name: e2e
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'main'
      - 'release/**'
jobs:
  kind-linux-amd64:
    runs-on: ubuntu-latest
    permissions:
      contents: read # for reading the repository code.
    steps:
      - name: Test suite setup
        uses: fluxcd/gha-workflows/.github/actions/setup-kubernetes@v0.17.0
        with:
          go-version: 1.27.x
      - name: Verify
        run: make verify
      - name: Enable integration tests
        # Only run integration tests for main and release branches
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        run: |
          echo 'GO_TAGS=integration' >> $GITHUB_ENV
      - name: Run E2E tests
        env:
          SKIP_COSIGN_VERIFICATION: true
          CREATE_CLUSTER: false
        run: make e2e
      - name: Print controller logs
        if: always()
        continue-on-error: true
        run: |
          kubectl -n source-system logs -l app=source-controller
  zot-oci-workload-identity:
    runs-on: ubuntu-latest
    permissions:
      contents: read # for reading the repository code.
    steps:
      - name: Test suite setup
        uses: fluxcd/gha-workflows/.github/actions/setup-kubernetes@v0.17.0
        with:
          go-version: 1.27.x
      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@main
      - name: Build container image
        run: |
          make docker-build IMG=test/source-controller TAG=latest \
            BUILD_PLATFORMS=linux/amd64 \
            BUILD_ARGS="--load"
      - name: Run Zot OCI workload identity e2e
        run: hack/ci/oci-zot-workload-identity-e2e.sh
        env:
          IMG: test/source-controller:latest
